<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Data From API</title>
    <style>
        *{
            padding : 0;
            margin: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
            margin : 20px 0;
        }
        .cards{
            display : flex;
            justify-content: space-evenly;
            flex-wrap : wrap;
        }
        .card{
            width : 23%;
            box-shadow : 0 0 15px 10px rgba(62, 60, 60, 0.3);
            padding : 1.5em;
            text-align: center;
            display : flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column;
            margin-bottom : 2em;
            min-height : 500px;
        }
        .images{
            width : 100%;
            height : 200px;
            object-fit : cover;
            margin: 10px 0;
        }
        .title{
            font-size : 1.2rem;
        }
        .category,.price{
            font-size : 1.2rem;
            font-weight : bold;
            text-transform : capitalize;
            margin : 1em;
        }
        .bott{
            margin-top : auto;
            border-top : 1px solid #ddd;
        }
    </style>
</head>
<body>
    <h1>Random Online Store</h1>
    <div class="cards">
        <!-- <div class="card">
            <h2 class="title">Title</h2>
            <img src="https://pixels.com/images/overview/apparel/mensTshirts002.jpg" alt="Card_Image" class="images">
            <p>Description</p>
            <div class="bott">
                <p class="category">Category</p>
                <p class="price">Price</p>
            </div> -->
        </div>
    </div>

    <script>
        fetch('https://fakestoreapi.com/products')
        .then((response) => (response.json()))
        .then((result) => {
            let data = "";
            result.map((items) => {
                data += `<div class="card">
                            <h2 class="title">${items.title}</h2>
                            <img src="${items.image}" alt="Card_Image" class="images">
                            <p><span style="font-weight : bold;">Description :</span> ${items.description}</p>
                            <div class="bott">
                            <p class="category">Category : ${items.category}</p>
                            <p class="price">Price : ${items.price}</p>
                            </div>
                        </div>`;
            });
            document.querySelector(".cards").innerHTML = data;

        }).catch(err => console.log(err));
    </script>
</body>
</html>
